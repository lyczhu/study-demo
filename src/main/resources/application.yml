# 内嵌数据库 h2
spring:
  datasource:
    url: jdbc:h2:file:~/.h2/h2
    username:
    password:
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 5  # 空闲连接数量
      maximum-pool-size: 20  # 最大连接数
      max-lifetime: 1800000  # 连接最大存活时间 30分钟
      idle-timeout: 300000  # 空闲连接超时时间 5分钟
      leak-detection-threshold: 30000  # 检测连接泄漏的时间阈值 30秒

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: redis://127.0.0.1:6379
          password:
          database: 0
        lockWatchdogTimeout: 30000

# 启用所有端点（生产环境建议只开放需要的端点）
management:
  endpoints:
    web:
      exposure:
        include: "*"
        # 或指定需要的端点
        # include: health,info,metrics,loggers

  endpoint:
    health:
      show-details: always  # 显示健康检查详情
    shutdown:
      access: none
